<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Observer Operation Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #050a12;
            --panel: rgba(11, 20, 32, 0.84);
            --panel-2: rgba(15, 27, 43, 0.78);

            --border: rgba(111, 190, 255, 0.14);
            --border-hover: rgba(74, 211, 255, 0.34);

            --text: #edf7ff;
            --muted: #8191a5;

            --cyan: #48d8ff;
            --blue: #3d8bff;

            --green: #35dfa0;
            --red: #ff5e70;
            --orange: #ffad5c;

            --shadow:
                0 25px 70px rgba(0, 0, 0, 0.42),
                inset 0 1px 0 rgba(255,255,255,0.025);
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            font-family: Inter, Arial, Helvetica, sans-serif;

            color: var(--text);

            background:
                radial-gradient(circle at 8% 5%, rgba(35, 145, 255, 0.14), transparent 27%),
                radial-gradient(circle at 92% 10%, rgba(0, 219, 255, 0.08), transparent 25%),
                radial-gradient(circle at 50% 100%, rgba(35, 90, 255, 0.08), transparent 35%),
                var(--bg);

            overflow-x: hidden;
        }

        /* =========================================
           BACKGROUND GRID
        ========================================= */

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            z-index: 0;
            pointer-events: none;

            background-image:
                linear-gradient(rgba(255,255,255,0.017) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.017) 1px, transparent 1px);

            background-size: 44px 44px;

            mask-image: linear-gradient(to bottom, black, transparent 92%);
        }

        /* =========================================
           AMBIENT GLOWS
        ========================================= */

        .ambient {
            position: fixed;

            width: 420px;
            height: 420px;

            border-radius: 50%;

            filter: blur(105px);

            pointer-events: none;

            z-index: 0;

            opacity: 0.14;
        }

        .ambient.one {
            left: -210px;
            top: -220px;

            background: #168cff;
        }

        .ambient.two {
            right: -220px;
            top: 180px;

            background: #00d9ff;

            opacity: 0.075;
        }

        /* =========================================
           PAGE
        ========================================= */

        .page {
            position: relative;
            z-index: 2;

            width: min(1500px, calc(100% - 40px));

            margin: 0 auto;

            padding: 24px 0 60px;
        }

        /* =========================================
           HEADER
        ========================================= */

        .header {
            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 20px;

            margin-bottom: 18px;

            padding: 17px 19px;

            border-radius: 18px;

            border: 1px solid var(--border);

            background:
                linear-gradient(
                    135deg,
                    rgba(18, 34, 54, 0.88),
                    rgba(7, 14, 24, 0.80)
                );

            box-shadow: var(--shadow);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .brand {
            display: flex;

            align-items: center;

            gap: 13px;

            min-width: 180px;
        }

        /* Logo: transparent PNG, shown directly on the header
           (no box / no white or tinted background behind it). */
        .brand-logo {
            height: 48px;
            width: 40px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: transparent;
            border: none;
            box-shadow: none;
        }

        .brand-logo img {
            height: 100%;
            width: auto;

            max-width: 100%;

            display: block;

            object-fit: contain;

            filter: drop-shadow(0 4px 12px rgba(51, 185, 255, 0.18));
        }

        .brand-text {
            min-width: 0;
        }

        .eyebrow {
            margin-bottom: 3px;

            color: var(--cyan);

            font-size: 9px;
            font-weight: 700;

            letter-spacing: 2px;

            text-transform: uppercase;
        }

        h1 {
            margin: 0;

            color: #f2f8ff;

            font-size: 21px;

            line-height: 1.2;

            font-weight: 700;

            letter-spacing: -0.35px;
        }

        /* =========================================
           HEADER BUTTONS
        ========================================= */

        .header-buttons {
            display: flex;

            align-items: center;

            justify-content: flex-end;

            flex-wrap: wrap;

            gap: 7px;
        }

        button {
            height: 36px;

            padding: 0 12px;

            border: 1px solid transparent;

            border-radius: 9px;

            color: white;

            font-family: inherit;

            font-size: 11px;
            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.18s ease,
                background 0.18s ease,
                border-color 0.18s ease,
                box-shadow 0.18s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .back-btn {
            background: rgba(255,255,255,0.055);

            border-color: rgba(255,255,255,0.10);

            color: #b8c8d9;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.09);

            border-color: rgba(255,255,255,0.18);

            color: white;
        }

        .pdf-btn {
            background: rgba(119, 130, 145, 0.17);

            border-color: rgba(255,255,255,0.10);

            color: #d4dce6;
        }

        .pdf-btn:hover {
            background: rgba(119, 130, 145, 0.27);
        }

        .excel-btn {
            background: linear-gradient(135deg, #159b72, #21c98c);

            box-shadow: 0 7px 22px rgba(25, 200, 139, 0.12);
        }

        .excel-btn:hover {
            box-shadow: 0 9px 27px rgba(25, 200, 139, 0.22);
        }

        .logout-btn {
            background: linear-gradient(135deg, #bd3044, #e94d61);

            box-shadow: 0 7px 22px rgba(232, 69, 91, 0.13);
        }

        .logout-btn:hover {
            box-shadow: 0 9px 27px rgba(232, 69, 91, 0.23);
        }

        /* =========================================
           USER CHIP
        ========================================= */

        .user-chip {
            display: flex;

            align-items: center;

            min-height: 34px;

            padding: 0 11px;

            border-radius: 9px;

            color: #9fb0c3;

            background: rgba(255,255,255,0.045);

            border: 1px solid rgba(255,255,255,0.075);

            font-size: 10px;

            white-space: nowrap;
        }

        .user-chip::before {
            content: "";

            width: 6px;
            height: 6px;

            margin-right: 7px;

            border-radius: 50%;

            background: var(--green);

            box-shadow: 0 0 9px rgba(53,223,160,0.65);
        }

        /* =========================================
           REPORT INFO
        ========================================= */

        .report-info {
            display: none;
        }

        /* =========================================
           CONTROLS
        ========================================= */

        .controls {
            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 15px;

            padding: 12px 14px;

            border: 1px solid var(--border);

            border-radius: 14px;

            background: rgba(10, 19, 31, 0.68);

            box-shadow: 0 14px 40px rgba(0,0,0,0.18);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .controls::before {
            content: "FILTERS";

            color: #60738a;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 1.5px;
        }

        select {
            height: 34px;

            min-width: 150px;

            padding: 0 30px 0 11px;

            border: 1px solid rgba(118, 169, 207, 0.16);

            border-radius: 8px;

            outline: none;

            color: #dce9f6;

            background-color: #101d2c;

            font-family: inherit;

            font-size: 11px;

            cursor: pointer;
        }

        select:hover {
            border-color: rgba(72, 216, 255, 0.30);
        }

        select:focus {
            border-color: rgba(72, 216, 255, 0.42);

            box-shadow: 0 0 0 3px rgba(72,216,255,0.06);
        }

        select option {
            background: #101a28;
            color: white;
        }

        /* =========================================
           SEARCH BOX
        ========================================= */

        #f-search {
            height: 34px;

            flex: 1;

            min-width: 200px;
            max-width: 340px;

            padding: 0 12px;

            border: 1px solid rgba(118, 169, 207, 0.16);

            border-radius: 8px;

            outline: none;

            color: #dce9f6;

            background-color: #101d2c;

            font-family: inherit;

            font-size: 11px;
        }

        #f-search::placeholder {
            color: #60738a;
        }

        #f-search:hover {
            border-color: rgba(72, 216, 255, 0.30);
        }

        #f-search:focus {
            border-color: rgba(72, 216, 255, 0.42);

            box-shadow: 0 0 0 3px rgba(72,216,255,0.06);
        }

        /* =========================================
           TABLE CONTAINER
        ========================================= */

        .table-wrapper {
            overflow: hidden;

            border: 1px solid var(--border);

            border-radius: 18px;

            background: rgba(9, 17, 28, 0.78);

            box-shadow: var(--shadow);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            overflow-x: auto;
        }

        table {
            width: 100%;

            min-width: 900px;

            border-collapse: separate;
            border-spacing: 0;

            background: transparent;
        }

        th,
        td {
            padding: 13px 14px;

            text-align: left;

            border-bottom: 1px solid rgba(255,255,255,0.055);

            font-size: 11px;

            white-space: nowrap;
        }

        th {
            position: sticky;
            top: 0;

            z-index: 2;

            color: #91a5ba;

            background:
                linear-gradient(
                    180deg,
                    rgba(20, 37, 57, 0.96),
                    rgba(13, 25, 40, 0.96)
                );

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 1px;

            text-transform: uppercase;

            border-bottom: 1px solid rgba(73,216,255,0.13);
        }

        th.col-num,
        td.col-num {
            width: 44px;

            color: #5f7488;

            font-weight: 600;

            text-align: center;
        }

        td {
            color: #b9c9d9;

            background: rgba(7, 14, 24, 0.34);
        }

        /* Subtle zebra striping on screen for readability */
        tbody tr:nth-child(even) td {
            background: rgba(255,255,255,0.018);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tr.row-clickable {
            cursor: pointer;

            transition: background 0.17s ease;
        }

        tr.row-clickable:hover td {
            background: rgba(46, 168, 255, 0.055);

            border-bottom-color: rgba(72,216,255,0.10);
        }

        td b {
            color: #edf7ff;

            font-weight: 650;
        }

        /* =========================================
           STATUS BADGES
        ========================================= */

        .badge {
            display: inline-flex;

            align-items: center;

            gap: 6px;

            padding: 5px 9px;

            border-radius: 999px;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 0.4px;
        }

        .badge::before {
            content: "";

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: currentColor;

            box-shadow: 0 0 9px currentColor;
        }

        .online {
            color: var(--green);

            background: rgba(53,223,160,0.08);

            border: 1px solid rgba(53,223,160,0.15);
        }

        .offline {
            color: var(--red);

            background: rgba(255,94,112,0.08);

            border: 1px solid rgba(255,94,112,0.15);
        }

        .batt-zero {
            color: var(--red) !important;

            font-weight: 700;
        }

        /* =========================================
           LOADING ROW
        ========================================= */

        #tbody td {
            height: 55px;
        }

        /* =========================================
           PRINT / PDF
        ========================================= */

        @media print {

            @page {
                size: A4 landscape;
                margin: 10mm;
            }

            body {
                background: white !important;

                color: #111;

                padding: 0;
            }

            body::before,
            .ambient {
                display: none !important;
            }

            .page {
                width: 100%;

                padding: 0;
            }

            .header {
                margin-bottom: 10px;

                padding: 0;

                border: none;

                background: white;

                box-shadow: none;

                backdrop-filter: none;
            }

            .header-buttons,
            .controls {
                display: none !important;
            }

            .brand-logo {
                height: 56px;
                width: 46px;
            }

            .brand-logo img {
                filter: none;
            }

            h1 {
                color: #000;

                font-size: 22px;
            }

            .eyebrow {
                color: #555;
            }

            .header {
                border-bottom: 3px solid #1976d2;

                padding-bottom: 10px !important;
            }

            .report-info {
                display: flex;

                align-items: center;

                gap: 10px;

                flex-wrap: wrap;

                margin-bottom: 15px;

                color: #555;

                font-size: 11px;
            }

            .report-info .stat-chip {
                display: inline-flex;

                align-items: center;

                gap: 5px;

                padding: 3px 10px;

                border-radius: 999px;

                font-size: 10px;

                font-weight: 700;

                color: #fff;

                -webkit-print-color-adjust: exact;

                print-color-adjust: exact;
            }

            .report-info .stat-chip.total {
                background: #455a64;
            }

            .report-info .stat-chip.online {
                background: #2e7d32;
            }

            .report-info .stat-chip.offline {
                background: #c62828;
            }

            .table-wrapper {
                overflow: visible;

                border: 1px solid #ddd;

                border-radius: 5px;

                box-shadow: none;

                background: white;
            }

            table {
                min-width: 0;

                background: white;
            }

            th,
            td {
                padding: 6px;

                font-size: 9px;
            }

            th {
                position: static;

                background: #1976d2 !important;

                color: white !important;

                -webkit-print-color-adjust: exact;

                print-color-adjust: exact;
            }

            th.col-num,
            td.col-num {
                color: inherit;
            }

            td {
                color: #222;

                background: white !important;

                border-bottom: 1px solid #eee;
            }

            /* Zebra striping carried into print for readability */
            tbody tr:nth-child(even) td {
                background: #f3f8fd !important;

                -webkit-print-color-adjust: exact;

                print-color-adjust: exact;
            }

            /* td b (Unit Name column) would otherwise inherit the light
               dark-theme color and be near-invisible on white paper. */
            td b {
                color: #000 !important;
            }

            /* Solid, high-contrast badge fills for print */
            .badge {
                -webkit-print-color-adjust: exact;

                print-color-adjust: exact;

                color: #fff !important;

                border: none !important;
            }

            .badge::before {
                display: none;
            }

            .online {
                background: #2e7d32 !important;
            }

            .offline {
                background: #c62828 !important;
            }

            tr {
                page-break-inside: avoid;
            }

            thead {
                display: table-header-group;
            }
        }

        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 1150px) {

            .header {
                align-items: flex-start;

                flex-direction: column;
            }

            .header-buttons {
                width: 100%;

                justify-content: flex-start;
            }
        }

        @media (max-width: 720px) {

            .page {
                width: calc(100% - 20px);

                padding-top: 10px;
            }

            .header {
                padding: 15px;
            }

            .brand-logo {
                height: 44px;
                width: 36px;
            }

            h1 {
                font-size: 19px;
            }

            .header-buttons {
                display: grid;

                grid-template-columns: repeat(2, minmax(0, 1fr));

                width: 100%;
            }

            .header-buttons button,
            .user-chip {
                width: 100%;
            }

            .controls {
                align-items: stretch;

                flex-direction: column;
            }

            .controls::before {
                display: block;
            }

            select,
            #f-search {
                width: 100%;

                max-width: none;
            }

            .table-wrapper {
                border-radius: 14px;
            }
        }

        @media (max-width: 430px) {

            .header-buttons {
                grid-template-columns: 1fr;
            }

            .brand {
                width: 100%;
            }
        }
    </style>

</head>

<body>

    <div class="ambient one"></div>
    <div class="ambient two"></div>

    <main class="page">

        <!-- =========================
             HEADER
        ========================== -->

        <div class="header">

            <div class="brand">

                <div class="brand-logo">
                    <img
                        src="/assets/logo-icon.png"
                        alt="Observer"
                    >
                </div>

                <div class="brand-text">

                    <div class="eyebrow">
                        Observer Fleet
                    </div>

                    <h1>
                        All Units
                    </h1>

                </div>

            </div>


            <div class="header-buttons">

                <span
                    class="user-chip"
                    id="user-chip"
                >
                    ...
                </span>


                <button
                    class="back-btn"
                    onclick="window.location.href='/index.html'"
                >
                    ← Summary
                </button>


                <!-- SMS: hidden by default, shown to admin only (see checkAuth) -->
                <button
                    id="sms-btn"
                    style="display:none;"
                    onclick="window.location.href='/sms.html'"
                >
                    SMS
                </button>


                <button
                    id="wialon-reports-btn"
                    style="display:none;background:#616161;"
                    onclick="window.location.href='/wialon-reports.html'"
                >
                    Wialon Reports
                </button>


                <button
                    id="maintenance-btn"
                    style="display:none;background:#c62828;"
                    onclick="window.location.href='/maintenance.html'"
                >
                    🔧 Maintenance
                </button>


                <button
                    class="pdf-btn"
                    onclick="exportPDF()"
                >
                    Export PDF
                </button>


                <button
                    class="excel-btn"
                    onclick="exportExcel('all')"
                >
                    Export Excel
                </button>


                <button
                    class="excel-btn"
                    onclick="exportExcel('battery0')"
                >
                    Battery=0 Excel
                </button>


                <button
                    id="manage-users-btn"
                    style="display:none;background:#616161;"
                    onclick="window.location.href='/admin-users.html'"
                >
                    Manage Users
                </button>


                <button
                    class="logout-btn"
                    onclick="logout()"
                >
                    Logout
                </button>

            </div>

        </div>


        <!-- =========================
             REPORT INFO
        ========================== -->

        <div class="report-info">

            <span>
                Report generated:
                <span id="report-date"></span>
            </span>

            <span class="stat-chip total">
                Total: <span id="stat-total">0</span>
            </span>

            <span class="stat-chip online">
                Online: <span id="stat-online">0</span>
            </span>

            <span class="stat-chip offline">
                Offline: <span id="stat-offline">0</span>
            </span>

        </div>


        <!-- =========================
             FILTERS
        ========================== -->

        <div class="controls">

            <select
                id="f-status"
                onchange="render()"
            >
                <option value="all">
                    All Status
                </option>

                <option value="offline">
                    Offline (>6h)
                </option>
            </select>


            <select
                id="f-batt"
                onchange="render()"
            >
                <option value="all">
                    Battery: All
                </option>

                <!-- EDIT BY NADA — remove the zero-voltage-only choice from the Units battery dropdown. -->
            </select>


            <input
                type="search"
                id="f-search"
                placeholder="Search unit, account, location..."
                autocomplete="off"
                oninput="render()"
            >

        </div>


        <!-- =========================
             TABLE
        ========================== -->

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th class="col-num">
                            #
                        </th>

                        <th>
                            Account
                        </th>

                        <th>
                            Unit Name
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Last Message
                        </th>

                        <th>
                            Location
                        </th>

                        <th>
                            Offline Days
                        </th>

                        <th>
                            Battery
                        </th>

                        <th>
                            Device Battery
                        </th>

                    </tr>

                </thead>


                <tbody id="tbody">

                    <tr>

                        <td
                            colspan="9"
                            style="text-align:center;"
                        >
                            Loading...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </main>


    <script>

        let units = [];


        // =========================
        // AUTH CHECK
        // =========================

        async function checkAuth() {

            try {

                const res =
                    await fetch('/api/me');


                if (!res.ok) {

                    window.location.href =
                        '/login.html';

                    return null;
                }


                const data =
                    await res.json();


                document
                    .getElementById('user-chip')
                    .innerText =
                    `${data.user.displayName} (${data.user.role})`;


                if (
                    data.user.role === 'admin'
                ) {

                    document
                        .getElementById(
                            'manage-users-btn'
                        )
                        .style
                        .display =
                        'inline-block';

                }


                // SMS button: admin only
                if (
                    data.user.role === 'admin'
                ) {

                    document
                        .getElementById(
                            'sms-btn'
                        )
                        .style
                        .display =
                        'inline-block';

                }


                if (
                    data.user.role === 'admin' ||
                    (
                        data.user.permissions &&
                        data.user.permissions.wialonReports
                    )
                ) {

                    document
                        .getElementById(
                            'wialon-reports-btn'
                        )
                        .style
                        .display =
                        'inline-block';

                }


                if (
                    data.user.role === 'admin' ||
                    (
                        data.user.permissions &&
                        data.user.permissions.maintenance
                    )
                ) {

                    document
                        .getElementById(
                            'maintenance-btn'
                        )
                        .style
                        .display =
                        'inline-block';

                }


                return data.user;


            } catch (error) {

                window.location.href =
                    '/login.html';

                return null;

            }

        }


        async function logout() {

            await fetch(
                '/api/logout',
                {
                    method: 'POST'
                }
            );

            window.location.href =
                '/login.html';

        }


        // =========================
        // LOAD DATA
        // =========================

        async function loadData() {

            try {

                const res =
                    await fetch(
                        '/api/dashboard'
                    );


                if (
                    res.status === 401
                ) {

                    window.location.href =
                        '/login.html';

                    return;
                }


                if (!res.ok) {

                    throw new Error(
                        'Dashboard API failed'
                    );

                }


                const data =
                    await res.json();


                if (
                    !data.success &&
                    data.error
                ) {

                    throw new Error(
                        data.error
                    );

                }


                units =
                    data.units || [];


                render();


            } catch (error) {

                console.error(error);


                document
                    .getElementById('tbody')
                    .innerHTML = `

                        <tr>

                            <td
                                colspan="9"
                                style="
                                    text-align:center;
                                    color:#ff6879;
                                "
                            >
                                Error loading fleet data
                            </td>

                        </tr>

                    `;

            }

        }


        // =========================
        // RENDER TABLE
        // =========================

        function render() {

            const tbody =
                document.getElementById(
                    'tbody'
                );


            const st =
                document.getElementById(
                    'f-status'
                ).value;


            const bt =
                document.getElementById(
                    'f-batt'
                ).value;


            const q =
                (
                    document.getElementById(
                        'f-search'
                    ).value || ''
                )
                    .trim()
                    .toLowerCase();


            const filtered =
                units.filter(u => {

                    if (
                        st === 'offline' &&
                        !u.isOffline
                    ) {

                        return false;

                    }


                    if (
                        bt === '0v' &&
                        Number(u.batteryVolts) !== 0
                    ) {

                        return false;

                    }


                    // ---- text search ----

                    if (q) {

                        const haystack =
                            [
                                u.name,
                                u.accountGroup,
                                u.location,
                                u.lastMessageTime,
                                u.isOffline
                                    ? 'offline'
                                    : 'online'
                            ]
                                .join(' ')
                                .toLowerCase();


                        if (
                            !haystack.includes(q)
                        ) {

                            return false;

                        }

                    }


                    return true;

                });


            if (
                filtered.length === 0
            ) {

                tbody.innerHTML = `

                    <tr>

                        <td
                            colspan="9"
                            style="
                                text-align:center;
                                color:#7f91a6;
                            "
                        >
                            No data found
                        </td>

                    </tr>

                `;

                return;

            }


            // Build the whole table body as one string and assign it
            // once (much faster than += on innerHTML for every row,
            // which matters now that render() runs on every keystroke).

            let html = '';


            filtered.forEach((u, idx) => {

                const status =
                    u.isOffline
                        ? 'Offline'
                        : 'Online';


                const statusClass =
                    u.isOffline
                        ? 'offline'
                        : 'online';


                const battClass =
                    Number(u.batteryVolts) === 0
                        ? 'batt-zero'
                        : '';


                html += `

                    <tr
                        class="row-clickable"
                        onclick="openUnit(${u.id})"
                    >

                        <td class="col-num">
                            ${idx + 1}
                        </td>


                        <td>
                            ${escapeHTML(
                                u.accountGroup
                            )}
                        </td>


                        <td>
                            <b>
                                ${escapeHTML(
                                    u.name
                                )}
                            </b>
                        </td>


                        <td>

                            <span
                                class="badge ${statusClass}"
                            >
                                ${status}
                            </span>

                        </td>


                        <td>
                            ${escapeHTML(
                                u.lastMessageTime
                            )}
                        </td>


                        <td>
                            ${escapeHTML(
                                u.location
                            )}
                        </td>


                        <td>
                            ${u.offlineDays}
                        </td>


                        <td
                            class="${battClass}"
                        >
                            ${u.batteryVolts} V
                        </td>


                        <td>
                            ${u.deviceBatteryVolts} V
                        </td>

                    </tr>

                `;

            });


            tbody.innerHTML = html;

        }


        function openUnit(unitId) {

            window.location.href =
                `/unit.html?id=${unitId}`;

        }


        // =========================
        // EXPORT EXCEL
        // =========================

        function exportExcel(filter) {

            window.location.href =
                `/api/reports/export?filter=${encodeURIComponent(filter)}`;

        }


        // =========================
        // EXPORT PDF
        // =========================

        function exportPDF() {

            const now =
                new Date();


            document
                .getElementById(
                    'report-date'
                )
                .innerText =
                now.toLocaleString(
                    'en-US'
                );


            const onlineCount =
                units.filter(
                    u => !u.isOffline
                ).length;


            document
                .getElementById(
                    'stat-total'
                )
                .innerText =
                units.length;


            document
                .getElementById(
                    'stat-online'
                )
                .innerText =
                onlineCount;


            document
                .getElementById(
                    'stat-offline'
                )
                .innerText =
                units.length - onlineCount;


            window.print();

        }


        // =========================
        // HTML ESCAPE
        // =========================

        function escapeHTML(value) {

            if (
                value === null ||
                value === undefined
            ) {
                return '';
            }


            return String(value)

                .replace(
                    /&/g,
                    '&amp;'
                )

                .replace(
                    /</g,
                    '&lt;'
                )

                .replace(
                    />/g,
                    '&gt;'
                )

                .replace(
                    /"/g,
                    '&quot;'
                )

                .replace(
                    /'/g,
                    '&#039;'
                );

        }


        // =========================
        // INIT
        // =========================

        (async function init() {

            const user =
                await checkAuth();


            if (user) {

                const params =
                    new URLSearchParams(
                        window.location.search
                    );


                const urlFilter =
                    params.get('filter');


                if (
                    urlFilter === 'offline'
                ) {

                    document
                        .getElementById(
                            'f-status'
                        )
                        .value =
                        'offline';

                }

                else if (
                    urlFilter === 'battery0'
                ) {

                    document
                        .getElementById(
                            'f-batt'
                        )
                        .value =
                        // EDIT BY NADA — legacy zero-only links default to All after removing that dropdown choice.
                        'all';

                }


                loadData();

            }

        })();

    </script>


</body>
