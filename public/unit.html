<style>
    * {
        box-sizing: border-box;
    }

    :root {
        --bg: #060b13;

        --panel-soft: rgba(17, 28, 43, 0.72);

                rgba(30, 100, 255, 0.08),

       BACKGROUND GRID
    ========================================= */

        position: fixed;

       AMBIENT GLOW

    .ambient.one {

        background: #00d9ff;

    /* =========================================
       MAIN
    ========================================= */

    .page {

       HEADER

<script>

    const params =
        new URLSearchParams(
            window.location.search
        );

    const unitId =
        params.get('id');


    async function checkAuth() {

        const res =
            await fetch('/api/me');

        if (!res.ok) {

            window.location.href =
                '/login.html';

            return false;
        }

        return true;
    }


    function escapeHTML(value) {

        if (
            value === null ||
            value === undefined
        ) {
            return '';
        }

        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }


    async function loadUnit() {

        if (!unitId) {

            showError(
                'No unit id provided in URL (?id=...)'
            );

            return;
        }


        try {

            const res =
                await fetch(
                    `/api/units/${encodeURIComponent(unitId)}`
                );


            if (res.status === 401) {

                window.location.href =
                    '/login.html';

                return;
            }


            const data =
                await res.json();


            if (!data.success) {

                showError(
                    data.error ||
                    'Failed to load unit'
                );

                return;
            }


            renderUnit(data.unit);


        } catch (error) {

            showError(
                'Error loading unit data'
            );

        }

    }


    function renderUnit(u) {

        document
            .getElementById('u-name')
            .innerText =
            u.name;


        document
            .getElementById('u-account')
            .innerText =
            u.accountGroup;


        const badge =
            document.getElementById(
                'u-status-badge'
            );


        badge.innerText =
            u.status;


        badge.className =
            'badge ' +
            (
                u.isOffline
                    ? 'offline'
                    : 'online'
            );


        document
            .getElementById('u-lastmsg')
            .innerText =
            u.lastMessageTime;


        document
            .getElementById('u-offlinedays')
            .innerText =
            u.offlineDays;


        document
            .getElementById('u-location')
            .innerText =
            u.location;


        document
            .getElementById('u-battery')
            .innerText =
            `${u.batteryVolts} V`;


        document
            .getElementById('u-devbattery')
            .innerText =
            `${u.deviceBatteryVolts} V`;


        document
            .getElementById('u-battsource')
            .innerText =
            u.batterySource ||
            'none';


        if (
            u.batteryStatus === 'zero'
        ) {

            document
                .getElementById(
                    'u-battery-card'
                )
                .classList
                .add('batt-zero');

        }


        document
            .getElementById('u-mileage')
            .innerText =
            u.hasMileage
                ? 'Yes'
                : 'No';


        document
            .getElementById('u-fuel')
            .innerText =
            u.hasFuel
                ? 'Yes'
                : 'No';


        document
            .getElementById('loading')
            .style
            .display =
            'none';


        document
            .getElementById('content')
            .style
            .display =
            'block';

    }


    function showError(msg) {

        document
            .getElementById('loading')
            .style
            .display =
            'none';


        const box =
            document.getElementById(
                'error-box'
            );


        box.innerText =
            msg;


        box.style.display =
            'block';

    }


    function exportUnit() {

        if (!unitId) return;

        window.location.href =
            `/api/reports/export-unit/${encodeURIComponent(unitId)}`;

    }


    (async function init() {

        const ok =
            await checkAuth();

        if (ok) {

            loadUnit();

        }

    })();

</script>
