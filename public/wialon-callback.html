
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Observer | Signing you in...</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                Helvetica,
                sans-serif;

            color: #f8fafc;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(37, 99, 235, 0.18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(6, 182, 212, 0.14),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #050914 0%,
                    #08111f 45%,
                    #030711 100%
                );

            overflow: hidden;

            position: relative;
        }


        /* =====================================================
           BACKGROUND GRID
        ===================================================== */

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(255, 255, 255, 0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.025) 1px,
                    transparent 1px
                );

            background-size: 45px 45px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black,
                    transparent 90%
                );

            pointer-events: none;
        }


        /* =====================================================
           GLOW ORBS
        ===================================================== */

        body::after {
            content: "";

            position: fixed;

            width: 420px;
            height: 420px;

            border-radius: 50%;

            top: -180px;
            right: -120px;

            background:
                radial-gradient(
                    circle,
                    rgba(14, 165, 233, 0.16) 0%,
                    rgba(14, 165, 233, 0.04) 45%,
                    transparent 70%
                );

            filter: blur(10px);

            pointer-events: none;
        }


        /* =====================================================
           MAIN CARD
        ===================================================== */

        .box {
            position: relative;

            width: min(500px, calc(100% - 32px));

            padding: 42px 38px 36px;

            text-align: center;

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(20, 30, 48, 0.88),
                    rgba(7, 14, 27, 0.92)
                );

            border: 1px solid rgba(255, 255, 255, 0.09);

            box-shadow:
                0 35px 100px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);

            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);

            z-index: 2;

            animation:
                cardIn 0.65s cubic-bezier(.2,.8,.2,1);
        }


        .box::before {
            content: "";

            position: absolute;

            inset: 0;

            border-radius: inherit;

            padding: 1px;

            background:
                linear-gradient(
                    135deg,
                    rgba(56, 189, 248, 0.25),
                    transparent 35%,
                    transparent 65%,
                    rgba(59, 130, 246, 0.18)
                );

            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);

            -webkit-mask-composite: xor;

            mask-composite: exclude;

            pointer-events: none;
        }


        /* =====================================================
           BRAND
        ===================================================== */

        .brand {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 12px;

            margin-bottom: 30px;
        }


        .logo {
            width: 58px;
            height: 58px;

            border-radius: 17px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    145deg,
                    #111827,
                    #020617
                );

            border: 1px solid rgba(255, 255, 255, 0.12);

            color: #ffffff;

            font-size: 25px;
            font-weight: 800;

            letter-spacing: -1px;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);

            position: relative;
        }


        .logo::after {
            content: "";

            position: absolute;

            width: 8px;
            height: 8px;

            border-radius: 50%;

            right: 7px;
            top: 7px;

            background: #22d3ee;

            box-shadow:
                0 0 12px rgba(34, 211, 238, 0.9);
        }


        .brand-name {
            text-align: left;
        }


        .brand-name strong {
            display: block;

            font-size: 17px;

            letter-spacing: 2px;

            color: #ffffff;
        }


        .brand-name span {
            display: block;

            margin-top: 3px;

            font-size: 11px;

            letter-spacing: 1.5px;

            text-transform: uppercase;

            color: #64748b;
        }


        /* =====================================================
           STATUS ICON
        ===================================================== */

        .loader-wrap {
            width: 86px;
            height: 86px;

            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(14, 165, 233, 0.08),
                    transparent 68%
                );

            position: relative;
        }


        .loader-wrap::before {
            content: "";

            position: absolute;

            inset: 0;

            border-radius: 50%;

            border: 1px solid rgba(56, 189, 248, 0.12);

            box-shadow:
                0 0 35px rgba(14, 165, 233, 0.08);
        }


        .loader {
            width: 48px;
            height: 48px;

            margin: 0;

            border: 3px solid rgba(255, 255, 255, 0.08);

            border-top-color: #38bdf8;
            border-right-color: #2563eb;

            border-radius: 50%;

            animation:
                spin 0.85s linear infinite;

            box-shadow:
                0 0 20px rgba(56, 189, 248, 0.18);
        }


        /* =====================================================
           TITLE
        ===================================================== */

        h2 {
            margin: 0 0 10px;

            font-size: 25px;

            font-weight: 700;

            letter-spacing: -0.6px;

            color: #f8fafc;
        }


        #status {
            color: #94a3b8;

            font-size: 14px;

            line-height: 1.7;

            min-height: 24px;

            transition:
                color 0.3s ease,
                opacity 0.3s ease;
        }


        /* =====================================================
           CONNECTION BADGE
        ===================================================== */

        .connection {
            display: inline-flex;

            align-items: center;

            gap: 8px;

            margin-top: 23px;

            padding: 8px 13px;

            border-radius: 999px;

            background:
                rgba(15, 23, 42, 0.7);

            border: 1px solid rgba(255, 255, 255, 0.07);

            color: #94a3b8;

            font-size: 11px;

            letter-spacing: 0.6px;

            text-transform: uppercase;
        }


        .connection-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #22d3ee;

            box-shadow:
                0 0 10px rgba(34, 211, 238, 0.9);

            animation:
                pulse 1.6s ease-in-out infinite;
        }


        /* =====================================================
           SUCCESS
        ===================================================== */

        .success {
            color: #4ade80 !important;
        }


        /* =====================================================
           ERROR
        ===================================================== */

        .error {
            color: #f87171;

            margin-top: 20px;

            padding: 14px 16px;

            font-size: 13px;

            line-height: 1.65;

            word-break: break-word;

            border-radius: 13px;

            background:
                rgba(127, 29, 29, 0.16);

            border: 1px solid rgba(248, 113, 113, 0.16);
        }


        /* =====================================================
           RETRY
        ===================================================== */

        #retry {
            margin-top: 22px;
        }


        #retry a {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 9px;

            min-width: 155px;

            padding: 12px 20px;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #0ea5e9
                );

            color: #ffffff;

            text-decoration: none;

            font-size: 13px;

            font-weight: 600;

            border: 1px solid rgba(255, 255, 255, 0.1);

            box-shadow:
                0 10px 25px rgba(37, 99, 235, 0.25);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;
        }


        #retry a::after {
            content: "→";

            font-size: 16px;

            transition:
                transform 0.2s ease;
        }


        #retry a:hover {
            transform: translateY(-2px);

            filter: brightness(1.08);

            box-shadow:
                0 14px 32px rgba(37, 99, 235, 0.35);
        }


        #retry a:hover::after {
            transform: translateX(3px);
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .footer {
            margin-top: 30px;

            padding-top: 20px;

            border-top:
                1px solid rgba(255, 255, 255, 0.06);

            color: #475569;

            font-size: 10px;

            letter-spacing: 1.2px;

            text-transform: uppercase;
        }


        /* =====================================================
           ANIMATIONS
        ===================================================== */

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }


        @keyframes pulse {
            0%,
            100% {
                opacity: 0.45;

                transform: scale(0.85);
            }

            50% {
                opacity: 1;

                transform: scale(1.1);
            }
        }


        @keyframes cardIn {
            from {
                opacity: 0;

                transform:
                    translateY(18px)
                    scale(0.97);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 520px) {

            .box {
                width: calc(100% - 24px);

                padding:
                    34px
                    22px
                    28px;

                border-radius: 23px;
            }


            .brand {
                margin-bottom: 25px;
            }


            .logo {
                width: 52px;
                height: 52px;

                border-radius: 15px;

                font-size: 22px;
            }


            h2 {
                font-size: 22px;
            }


            .loader-wrap {
                width: 78px;
                height: 78px;
            }


            .loader {
                width: 43px;
                height: 43px;
            }
        }


        /* =====================================================
           REDUCED MOTION
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;

                animation-iteration-count: 1 !important;

                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>

<div class="box">

    <div class="brand">

        <div class="logo">
            O
        </div>

        <div class="brand-name">
            <strong>OBSERVER</strong>
            <span>Fleet Intelligence</span>
        </div>

    </div>


    <div class="loader-wrap">

        <div
            id="loader"
            class="loader"
        ></div>

    </div>


    <h2>Signing you in...</h2>


    <div id="status">
        Connecting to Wialon...
    </div>


    <div class="connection">

        <span class="connection-dot"></span>

        Secure Wialon Connection

    </div>


    <div
        id="error"
        class="error"
        style="display:none;"
    ></div>


    <div
        id="retry"
        style="display:none;"
    >

        <a href="/login.html">
            Back to login
        </a>

    </div>


    <div class="footer">
        Observer Fleet Management Platform
    </div>

</div>


<script>

(function () {

    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');
    const retryEl = document.getElementById('retry');
    const loaderEl = document.getElementById('loader');


    // =====================================================
    // SHOW ERROR
    // =====================================================

    function showError(message) {

        loaderEl.style.display = 'none';

        statusEl.style.display = 'none';

        errorEl.textContent = message;

        errorEl.style.display = 'block';

        retryEl.style.display = 'block';
    }


    // =====================================================
    // GET PARAMETERS FROM URL
    // =====================================================

    function getAccessToken() {

        /*
         * Wialon OAuth normally returns:
         *
         * #access_token=XXXX
         *
         * Browser-only URL fragment.
         *
         * Some flows/configurations may return parameters
         * through the normal query string instead, so we
         * support both.
         */


        // -------------------------------------------------
        // 1. Try URL HASH / FRAGMENT
        // -------------------------------------------------

        const hash = window.location.hash || '';

        if (hash) {

            const cleanHash = hash.startsWith('#')
                ? hash.substring(1)
                : hash;

            const hashParams =
                new URLSearchParams(cleanHash);

            const hashToken =
                hashParams.get('access_token');

            if (hashToken) {
                return hashToken;
            }
        }


        // -------------------------------------------------
        // 2. Try normal QUERY STRING
        // -------------------------------------------------

        const search =
            window.location.search || '';

        if (search) {

            const searchParams =
                new URLSearchParams(search);

            const queryToken =
                searchParams.get('access_token');

            if (queryToken) {
                return queryToken;
            }
        }


        // -------------------------------------------------
        // 3. No token
        // -------------------------------------------------

        return null;
    }


    // =====================================================
    // LOGIN WITH WIALON TOKEN
    // =====================================================

    async function loginWithWialon() {

        try {

            statusEl.textContent =
                'Reading Wialon authentication...';


            const accessToken =
                getAccessToken();


            // -------------------------------------------------
            // TOKEN NOT FOUND
            // -------------------------------------------------

            if (!accessToken) {

                console.log(
                    'Wialon OAuth URL:',
                    window.location.href.split('#')[0]
                );

                showError(
                    'Wialon لم يرجع access_token. جرب تسجيل الدخول مرة تانية.'
                );

                return;
            }


            // -------------------------------------------------
            // TOKEN FOUND
            // -------------------------------------------------

            statusEl.textContent =
                'Authenticating with Observer...';


            const response =
                await fetch(
                    '/api/login/wialon-token',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        credentials: 'include',

                        body: JSON.stringify({
                            access_token: accessToken
                        })
                    }
                );


            // -------------------------------------------------
            // CHECK HTTP RESPONSE
            // -------------------------------------------------

            let data;

            try {

                data = await response.json();

            } catch (jsonError) {

                throw new Error(
                    'Server returned an invalid response.'
                );
            }


            // -------------------------------------------------
            // SERVER LOGIN FAILED
            // -------------------------------------------------

            if (!response.ok || !data.success) {

                throw new Error(
                    data.error ||
                    data.message ||
                    `Login failed (${response.status})`
                );
            }


            // -------------------------------------------------
            // SUCCESS
            // -------------------------------------------------

            loaderEl.style.display = 'none';

            statusEl.classList.add('success');

            statusEl.textContent =
                'Login successful. Opening Observer...';


            /*
             * Give the browser a very short moment to save
             * the session cookie before redirecting.
             */

            setTimeout(function () {

                window.location.replace(
                    '/index.html'
                );

            }, 400);

        }

        catch (error) {

            console.error(
                'Wialon OAuth login error:',
                error
            );

            showError(
                error.message ||
                'Unable to complete Wialon login.'
            );
        }
    }


    // =====================================================
    // START
    // =====================================================

    if (
        document.readyState === 'loading'
    ) {

        document.addEventListener(
            'DOMContentLoaded',
            loginWithWialon
        );

    } else {

        loginWithWialon();
    }

})();

</script>

</body>
</html>
