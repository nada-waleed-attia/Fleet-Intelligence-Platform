        /* light darkening so white card text stays legible
           over busy areas of the photo without hiding it */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.15), rgba(0,0,0,0.35));
            pointer-events: none;
        }

        .login-box {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 340px;
            /* opaque-ish frosted panel: sits roughly where the
               reference design's form area is, so it visually
               replaces that area with a real working form */
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 18px;
            padding: 32px 30px 26px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .logo-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 22px;
        }

        .logo-row img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .logo-row span {
            font-size: 22px;
            font-weight: 800;
            color: #1a1a1a;
            letter-spacing: 0.5px;
        }

        label {
            display: block;
            text-align: left;
            font-size: 13px;
            color: #444;
            margin-bottom: 6px;
            margin-top: 14px;
        }

        .row-between {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .row-between a {
            font-size: 12px;
            color: #1976d2;
            text-decoration: none;
        }

        input {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            background: #fff;
            color: #1a1a1a;
        }

        input:focus {
            outline: none;
            border-color: #26a69a;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #26a69a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 0.3px;
        }

        button:hover {
            opacity: 0.92;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-msg {
            display: none;
            margin-top: 14px;
            padding: 9px;
            background: #ffebee;
            border: 1px solid #ffcdd2;
            color: #c62828;
            border-radius: 6px;
            font-size: 13px;
        }

        .footer-note {
            margin-top: 16px;
            font-size: 11px;
            color: #999;
        }
    </style>
</head>

        <form id="login-form">

            <div class="row-between">
                <label for="username" style="margin-top:0;">Email</label>
            </div>
            <input type="text" id="username" autocomplete="username" placeholder="Enter your username or email" required>

            <div class="row-between">
                <label for="password">Password</label>
            </div>
            <input type="password" id="password" autocomplete="current-password" placeholder="Enter your password" required>

            <div class="error-msg" id="error-msg"></div>

            <button type="submit" id="submit-btn">Login</button>

        </form>

        <div class="footer-note">Observer Fleet Management System</div>

    </div>

    <script>
        const form = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            errorMsg.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerText = 'Signing in...';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (!data.success) {
                    throw new Error(data.error || 'Login failed');
                }

                window.location.href = '/index.html';

            } catch (error) {
                errorMsg.innerText = error.message;
                errorMsg.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerText = 'Login';
            }
        });
    </script>
